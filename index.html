function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function id(p){return p+(++D.seq)}

function mv(vid,loc,d,ty,n,tid){D.moves.push({id:id("m"),t:Date.now(),u:curName(),vid:vid,loc:loc,d:d,ty:ty,n:n||"",tid:tid||""})}
function mk(o,sizes,colors,qty,loc){
 o.id=id("p");o.kind=o.kind||"batch";o.st="active";o.site=o.site!==false;o.maxD=o.maxD||{t:"%",v:0};D.prods.push(o);
 var S=sizes.length?sizes:[""],C=colors.length?colors:[""];
 S.forEach(function(s){C.forEach(function(c){addV(o,s,c,qty,loc)})});
}

function seed(){
 D={locs:[{id:"l1",n:"المحل الأول"},{id:"l2",n:"المحل الثاني"}],prods:[],vars:[],moves:[],groups:[],set:{theme:"auto",thB:2,thR:5},seq:1000};
 mk({n:"بنطلون جبردين أبيض",sec:"رجالي",cost:300,price:600,wp:520,maxD:{t:"%",v:20},th:2},["30","32","34"],["أبيض"],2,"l1");
 mk({n:"هودي زيب أسود",sec:"رجالي",cost:350,price:700,wp:620,maxD:{t:"%",v:15},th:3},["M","L","XL"],["أسود"],4,"l2");
 mk({n:"شراب قطن",sec:"داخلي",kind:"repeat",cost:20,price:40,wp:32,maxD:{t:"ج",v:5},pack:3,pp:100,th:10},["36-40","41-45"],["أسود"],12,"l1");
 mk({n:"روج مطفي",sec:"مكياج",kind:"repeat",cost:60,price:120,wp:100,exp:"2027-06",maxD:{t:"%",v:10},th:4},[],["وردي","أحمر"],5,"l1");
}
function vs(p){return D.vars.filter(function(v){return v.pid===p.id})}
function stock(vid,loc){var t=0;D.moves.forEach(function(m){if(m.vid===vid&&(loc==="all"||m.loc===loc))t+=m.d});return t}
function tot(p,loc){return vs(p).reduce(function(a,v){return a+stock(v.id,loc||"all")},0)}

function isFin(p){return p.st==="arch"||(p.kind==="batch"&&had(p)&&tot(p)<=0)}
function lab(v){return [v.size,v.color].filter(Boolean).join(" / ")||"عادي"}
function locN(i){var r="";D.locs.forEach(function(l){if(l.id===i)r=l.n});return r}

 var a=[];
 D.prods.forEach(function(p){if(p.st==="arch")return;var t=tot(p);
  if(t<=0&&p.kind==="repeat"&&had(p))a.push({k:"out",p:p,t:t});
  else if(t>0&&t<=p.th)a.push({k:"low",p:p,t:t});var ed=expDays(p);if(ed!==null&&t>0&&ed<=(D.set.expDays||60))a.push({k:"exp",p:p,t:t,days:ed})});
 D.groups.forEach(function(g){var t=0;g.pids.forEach(function(i){var p=P(i);if(p)t+=tot(p)});if(t<=g.th)a.push({k:"grp",g:g,t:t})});
 return a;
}

 var G=[["",[["home","الرئيسية"]]],["المبيعات",[["sale","الكاشير"],["inv","الفواتير"],["cus","العملاء"],["close","إقفال اليوم"]]],["المخزون",[["p","المنتجات والمخزون"],["n","منتج جديد"],["trf","تحويل بين الفروع"],["cnt","الجرد الشامل"],["r","المراجعة والتنبيهات"],["l","سجل الحركات"],["pl","الأماكن"]]],["المشتريات",[["sup","الموردين وفواتير الشراء"],["rord","اقتراح طلبية شراء"]]],["الإدارة",[["exp","المصروفات"],["an","تحليلات المبيعات"],["ai","المساعد الذكي"],["rep","التقارير"],["s","الإعدادات"],["users","المستخدمين والصلاحيات"]]]];
 $("side").innerHTML='<div class="brand">A&amp;N <small>STORE</small></div><div class="ver">النسخة 1.0</div>'+G.map(function(g){if(!g[1].some(function(t){return screenOk(t[0])}))return "";return (g[0]?'<div class="gl">'+g[0]+'</div>':'')+g[1].filter(function(t){return screenOk(t[0])}).map(function(t){if(t[0]===V.tab)title=t[1];return '<button class="ni'+(t[0]===V.tab?' on':'')+'" onclick="nav(\''+t[0]+'\')">'+'<span class="ic">'+(ICON[t[0]]||"•")+'</span><span class="lb">'+t[1]+'</span>'+(t[0]==="r"&&n?'<span class="cnt">'+n+'</span>':'')+'</button>'}).join("")}).join("");
 $("title").textContent=title;$("bell").textContent="التنبيهات"+(n?" ("+n+")":"");$("bell").style.display=screenOk("r")?"":"none";$("usr").textContent=curName();$("thb").textContent="المظهر: "+({auto:"تلقائي",light:"فاتح",dark:"داكن"}[D.set.theme]||"تلقائي");
}

 var d0=dayStart(),g=0,pf=0,cnt=0;
 D.inv.filter(function(i){return i.t>=d0}).forEach(function(i){cnt++;i.lines.forEach(function(l){g+=(l.price-l.d)*l.q;pf+=(l.price-l.d-l.cost)*l.q})});

 var A=alerts(),nn=D.notes.filter(function(x){return !x.s}).length,cd=D.cus.reduce(function(a,c){return a+Math.max(0,cusBal(c.id))},0);

 '<div class="card"><b>ابدأ من هنا</b><div class="r"><button class="b p" onclick="nav(\'sale\')">فاتورة بيع جديدة</button>'+qb("n","منتج جديد")+qb("sup","فاتورة شراء")+qb("rep","التقارير")+'</div></div>'+
 '<div class="card"><div class="t"><b>تحتاج انتباهك</b><button class="b" onclick="nav(\'r\')">عرض الكل</button></div>'+((A.length||nn)?'':'<p class="m">كل حاجة تمام.</p>')+(nn?'<div class="wn">'+nn+' إشعار جديد</div>':'')+A.slice(0,5).map(function(a){var nm=a.k==="grp"?"مجموعة: "+a.g.n:a.p.n;return '<div class="t" '+row+'><span>'+esc(nm)+'</span><span class="'+(a.k==="out"?"low":"wn")+'">'+(a.k==="out"?"نفد":a.k==="exp"?"الصلاحية قربت":"المتبقي "+a.t)+'</span></div>'}).join("")+'</div>'+
 '<div class="card"><div class="t"><b>آخر الفواتير</b><button class="b" onclick="nav(\'inv\')">كل الفواتير</button></div>'+(D.inv.slice(-5).reverse().map(function(i){return '<div class="t" '+row+'><span>#'+i.no+' | '+esc(cusN(i.cus))+'</span><b>'+fm(i.total)+'</b></div>'}).join("")||'<p class="m">لسه مفيش فواتير بيع.</p>')+'</div>';
}
function vP(){
 var q=V.q.trim().toLowerCase(),h="";

 var n=0;

function saleSave(){
 var c=C(),e=$("se");if(!c.lines.length){e.textContent="الفاتورة فاضية.";return}
 var T=c.lines.map(lineCalc),need={};if(!can("discount")&&c.lines.some(function(l){return !l.off&&(+l.dv||0)>0})){e.textContent="مفيش عندك صلاحية خصم.";return}
 for(var i=0;i<T.length;i++){var x=T[i];if(!(c.lines[i].q>=1)){e.textContent="الكمية لازم ١ أو أكتر.";return}if(x.over){e.textContent="في صنف خصمه فوق الأقصى ومحتاج موافقة المدير.";return}need[x.v.id]=(need[x.v.id]||0)+x.pcs}
 for(var k in need)if(need[k]>stock(k,c.loc)){e.textContent="الكمية مش كفاية: "+vl(Vf(k))+" المتاح "+stock(k,c.loc);return}
 var total=Math.max(0,T.reduce((a,x)=>a+x.tot,0)-c.credit),cr=0;
 if(c.useCr&&c.cus){var cb=cusBal(c.cus);if(cb<0)cr=Math.min(-cb,total)}
 var a2=Math.max(0,Math.min(+c.amt2||0,total-cr)),rest=total-cr-a2,a1=c.paid===""?rest:Math.max(0,Math.min(+c.paid||0,rest)),paid=a1+a2+cr;
 if(paid<total-0.001&&!c.cus){e.textContent="اختار عميل لو في مبلغ آجل.";return}

 var no=nextNo("S",c.loc);
 D.inv.push({id:id("i"),no:no,t:Date.now(),by:curName(),loc:c.loc,cus:c.cus,sel:c.sel,credit:c.credit,total:total,paid:paid,pm:c.pm||"cash",pays:pays,lines:c.lines.map((l,i)=>({id:id("l"),vid:l.vid,q:l.q,u:l.u,price:T[i].price,d:T[i].d,cost:T[i].p.cost*(l.u==="k"?T[i].p.pack:1),ap:!!l.ap,off:!!l.off,rq:0}))});

function vLogin(){var m=V.lg||"";V.lg="";return '<div class="card f" style="max-width:420px;margin:40px auto"><b>تسجيل الدخول</b>'+F("le","الإيميل","","email")+'<label>الباسورد<input id="lpw" type="password" onkeydown="if(event.key===\'Enter\')doLogin()"></label><div class="err">'+esc(m)+'</div><button class="b p big" onclick="doLogin()">دخول</button></div>'}
async function doLogin(){
 var em=($("le").value||"").trim(),pw=$("lpw").value;
 if(!em||!pw){V.lg="اكتب الإيميل والباسورد.";showLoginScreen();return}
 V.boot=1;showLoginScreen();
 var r;try{r=await SB.auth.signInWithPassword({email:em,password:pw})}catch(e){r={error:e}}
 if(r.error){V.boot=0;V.lg=/invalid/i.test(r.error.message||"")?"الإيميل أو الباسورد غلط.":(isNet(r.error)?"مفيش اتصال بالإنترنت.":"مقدرتش أسجل الدخول: "+errMsg(r.error));showLoginScreen();return}
 await afterLogin(r.data.user);
}
function resetLocal(){D=blankD();ensure();SY.last={};SY.wm={};SY.out=[];SY.fail=[];SY.lastSet=JSON.stringify(setSub())}
async function afterLogin(user){
 V.boot=1;showLoginScreen();
 try{
  if(SY.cacheUid&&SY.cacheUid!==user.id){
   if(SY.out.length){V.boot=0;V.lg="الجهاز ده فيه عمليات لمستخدم تاني لسه ما اتزامنتش. سجّل دخول بالمستخدم السابق الأول.";try{await SB.auth.signOut()}catch(e){}showLoginScreen();return}
   resetLocal();
  }
  SY.uid=user.id;SY.cacheUid=user.id;
  var me=null,p=await SB.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(p.error){me=D.users.filter(function(x){return x.id===user.id})[0];if(!me)throw p.error}
  else if(!p.data){throw new Error("الحساب ده مالوش ملف في النظام.")}
  else me=SYNC[0].fr(p.data);
  if(!me.active){try{await SB.auth.signOut()}catch(e){}V.boot=0;V.lg="الحساب موقوف.";showLoginScreen();return}
  var ex=D.users.filter(function(x){return x.id===me.id})[0];if(ex){Object.assign(ex,me);ex._s=1}else{me._s=1;D.users.push(me)}
  V.u=user.id;SY.on=true;
  try{await pullAll(true)}catch(e){if(!D.locs.length)throw e}
  if(!D.locs.length)throw new Error("محتاج اتصال بالإنترنت أول مرة عشان نحمّل البيانات.");
  ensure();derive();
  var al=allowedLocs();V.loc=al.length===1?al[0].id:"all";V.cl=null;V.c=null;V.pu=null;V.tr=null;V.cn=null;V.tab="home";V.boot=0;V.sw=0;
  startTimers();render();syncTick();persist(1);
 }catch(e){V.boot=0;V.u=null;SY.on=false;V.lg="حصلت مشكلة: "+errMsg(e);showLoginScreen()}
}
function offlineUser(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k)){var o=JSON.parse(localStorage.getItem(k));if(o&&o.user&&o.user.id)return o.user}}}catch(e){}return null}
async function signOutUI(){await persist(1);try{await SB.auth.signOut()}catch(e){}SY.on=false;clearInterval(SY.timer);V.u=null;V.sw=0;V.boot=0;render()}
async function boot(){
 V.boot=1;D=blankD();ensure();SY.lastSet=JSON.stringify(setSub());theme();showLoginScreen();
 try{var c=await kvGet("cache");if(c&&c.D){D=c.D;SY.last=c.last||{};SY.wm=c.wm||{};SY.out=c.out||[];SY.fail=c.fail||[];SY.lastSet=c.lastSet||"";SY.cacheUid=c.uid||null;ensure();theme()}}catch(e){}
 aiInit();kbInit();
 if(!window.supabase){V.boot=0;V.lg="مكتبة Supabase مش متحمّلة. اتأكد من الإنترنت وحمّل الصفحة تاني.";showLoginScreen();return}
 SB=window.supabase.createClient(CFG.url,CFG.key);
 var s=null;try{var r=await SB.auth.getSession();s=r.data&&r.data.session}catch(e){}
 var u=(s&&s.user)||(!navigator.onLine?offlineUser():null);
 if(u)await afterLogin(u);else{V.boot=0;showLoginScreen()}
 window.addEventListener("online",function(){uiSync();syncTick();pullAll().then(function(ch){if(ch)softRender()}).catch(function(){})});
 window.addEventListener("offline",uiSync);
}
function curUser(){return D.users.filter(function(x){return x.id===V.u&&x.active})[0]||null}
/* ---------- users (real accounts) ---------- */
function vUsers(){
 var h='<div class="card f"><b>المستخدمين والصلاحيات</b><p class="m">كل مستخدم بيدخل بإيميله وباسورده. لو "تأكيد الإيميل" مفعّل في Supabase، المستخدم الجديد لازم يأكد إيميله الأول، فأقفله من Authentication ثم Sign In / Providers ثم Email.</p></div>';
 D.users.forEach(function(u){h+=userCard(u)});
 h+='<div class="card f"><b>إضافة مستخدم</b><div class="g2">'+F("un","الاسم","")+F("uem","الإيميل","","email")+'</div><div class="g2">'+F("upw","الباسورد (٦ حروف أو أكتر)","","password")+'<label>الدور<select id="ur"><option value="seller">بائع</option><option value="manager">مدير</option><option value="owner">مالك</option></select></label></div><label>الفرع<select id="ul"><option value="">كل الفروع</option>'+D.locs.map(function(l){return '<option value="'+l.id+'">'+esc(l.n)+'</option>'}).join("")+'</select></label><div class="err" id="ue"></div><button class="b p" onclick="addUser()">إضافة</button></div>';
 return h;
}
function userCard(u){
 var own=u.role==="owner",me=curUser()&&curUser().id===u.id,h='<div class="card"><div class="t"><b>'+esc(u.n)+(me?" (أنت)":"")+' <span class="bd">'+ROLE_LAB[u.role]+'</span>'+(u.active?'':' <span class="bd">موقوف</span>')+'</b><span class="m">'+(u.loc?esc(locN(u.loc)):"كل الفروع")+'</span></div><div class="g2" style="margin-top:8px"><label class="m">الدور<select onchange="setRole(\''+u.id+'\',this.value)"><option value="seller"'+(u.role==="seller"?" selected":"")+'>بائع</option><option value="manager"'+(u.role==="manager"?" selected":"")+'>مدير</option><option value="owner"'+(own?" selected":"")+'>مالك</option></select></label><label class="m">الفرع<select onchange="setUserLoc(\''+u.id+'\',this.value)"><option value="">كل الفروع</option>'+D.locs.map(function(l){return '<option value="'+l.id+'"'+(u.loc===l.id?" selected":"")+'>'+esc(l.n)+'</option>'}).join("")+'</select></label></div><div class="r"><button class="b" onclick="toggleUser(\''+u.id+'\')">'+(u.active?"إيقاف":"تفعيل")+'</button></div>';
 if(own)h+='<p class="m">المالك عنده كل الصلاحيات.</p>';
 else h+='<div style="margin-top:8px"><span class="m">الشاشات المسموحة:</span>'+ALLS.map(function(k){return pchk(u,"s_"+k,SCR_LAB[k]+(NEEDCOST.indexOf(k)>=0?" (مالية)":""))}).join("")+'</div><div style="margin-top:8px"><span class="m">الصلاحيات:</span>'+CAPS.map(function(k){return pchk(u,k,CAP_LAB[k])}).join("")+'</div>';
 return h+'</div>';
}
function delUser(){alert("حذف المستخدم مش متاح. أوقفه بدل كده.")}
async function addUser(){
 var n=$("un").value.trim(),em=$("uem").value.trim(),pw=$("upw").value,r=$("ur").value,l=$("ul").value,e=$("ue");
 if(!n){e.textContent="اكتب الاسم.";return}
 if(!/^\S+@\S+\.\S+$/.test(em)){e.textContent="اكتب إيميل صحيح.";return}
 if(pw.length<6){e.textContent="الباسورد لازم ٦ حروف أو أكتر.";return}
 if(r==="seller"&&!l)l=D.locs[0].id;
 e.textContent="بعمل الحساب...";
 try{
  var sec=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  var res=await sec.auth.signUp({email:em,password:pw,options:{data:{name:n}}});
  if(res.error){e.textContent="مقدرتش أعمل الحساب: "+errMsg(res.error);return}
  var us=res.data&&res.data.user;
  if(!us||(us.identities&&us.identities.length===0)){e.textContent="الإيميل ده مستخدم قبل كده.";return}
  var up=await SB.from("profiles").update({name:n,role:r,location_id:l||null,perms:preset(r)}).eq("id",us.id);
  if(up.error){e.textContent="الحساب اتعمل بس الصلاحيات ما اتحفظتش: "+errMsg(up.error);return}
  await pullAll(true);render();
 }catch(x){e.textContent="حصلت مشكلة: "+errMsg(x)}
}
/* ---------- manager approval code (checked on the server) ---------- */
function pinDlg(i){if(can("approveOver")){pinApply(i,curName());return}$("dlg").innerHTML='<div class="f"><b>موافقة المدير</b><p class="m">الخصم أعلى من الأقصى المسموح. اكتب كود المدير.</p>'+F("pp","كود المدير","","password")+'<div class="err" id="pne"></div><div class="g2"><button class="b p" onclick="pinOk('+i+')">موافقة</button><button class="b" onclick="$(\'dlg\').close()">إلغاء</button></div></div>';$("dlg").showModal()}
async function pinOk(i){var r;try{r=await SB.rpc("verify_manager_code",{code:$("pp").value})}catch(e){r={error:e}}if(r.error){$("pne").textContent="مقدرتش أتحقق (محتاج اتصال بالإنترنت).";return}if(r.data!==true){$("pne").textContent="الكود غلط.";return}pinApply(i,"المدير")}
function vS2(){return '<div class="card f"><b>إعدادات المبيعات والفاتورة</b><div class="g2">'+F("sstag","أيام اعتبار الصنف راكد",D.set.stag,"number")+F("sexp","تنبيه الصلاحية قبل (يوم)",D.set.expDays||60,"number")+'</div><div class="g2">'+F("scv","أيام تغطية الطلبية المقترحة",D.set.cover||30,"number")+F("svd","فترة حساب سرعة البيع (يوم)",D.set.velDays||30,"number")+'</div>'+F("shn","اسم المحل على الفاتورة",D.set.shn||"")+'<div class="g2">'+F("shp","تليفون المحل",D.set.shp||"")+F("sha","العنوان",D.set.sha||"")+'</div>'+F("shf","جملة آخر الفاتورة",D.set.shf||"")+F("ssl","أسماء البائعين (افصل بفاصلة)",(D.set.sellers||[]).join(","))+'<button class="b p" onclick="setS2()">حفظ</button></div>'+(isOwner()?'<div class="card f"><b>كود المدير (للموافقة على الخصم فوق الأقصى)</b><p class="m">الكود الافتراضي ١٢٣٤، غيّره دلوقتي.</p>'+F("scode","كود جديد (٤ أرقام أو أكتر)","","password")+'<div class="err" id="sce"></div><button class="b" onclick="setCode()">تغيير الكود</button></div>':'')}
function setS2(){var s=D.set;s.stag=+$("sstag").value||60;s.expDays=+$("sexp").value||60;s.cover=+$("scv").value||30;s.velDays=+$("svd").value||30;s.shn=$("shn").value.trim();s.shp=$("shp").value.trim();s.sha=$("sha").value.trim();s.shf=$("shf").value.trim();s.sellers=$("ssl").value.split(",").map(function(x){return x.trim()}).filter(Boolean);save();render()}
async function setCode(){var v=$("scode").value;if(!/^\d{4,}$/.test(v)){$("sce").textContent="الكود لازم ٤ أرقام أو أكتر.";return}var r=await SB.rpc("set_manager_code",{code:v});$("sce").textContent=r.error?"مقدرتش أغيّر الكود: "+errMsg(r.error):"اتغير الكود.";$("scode").value=""}
function vS3(){return '<div class="card"><b>تصدير ونسخ احتياطي</b><div class="r"><button class="b" onclick="expStock()">تصدير المخزون (CSV)</button><button class="b" onclick="expSales()">تصدير المبيعات (CSV)</button><button class="b" onclick="expBackup()">نسخة احتياطية (JSON)</button></div><p class="m">البيانات الأساسية محفوظة على Supabase، والنسخة دي إضافية.</p></div>'}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
BOOT=boot();
